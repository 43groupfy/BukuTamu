<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- Definisi Gradient Warna (Warna Biru Primary Aplikasi) -->
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.15" />
        </filter>
    </defs>

    <!-- Background Kotak Melengkung (Squircle ala Icon Aplikasi HP) -->
    <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" filter="url(#shadow)" />

    <!-- Elemen Kertas / Clipboard -->
    <rect x="146" y="146" width="220" height="260" rx="24" fill="none" stroke="#ffffff" stroke-width="28" />
    
    <!-- Elemen Jepitan Papan (Top Binder) -->
    <path d="M206 146 v -20 a 16 16 0 0 1 16 -16 h 68 a 16 16 0 0 1 16 16 v 20" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
    
    <!-- Ikon Siluet Tamu (Kepala) -->
    <circle cx="256" cy="236" r="34" fill="#ffffff" />
    
    <!-- Ikon Siluet Tamu (Badan) -->
    <path d="M192 340 q 0 -52 64 -52 q 64 0 64 52" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />

    <!-- Aksen Garis (Tanda Tangan / Waktu) -->
    <line x1="200" y1="370" x2="312" y2="370" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
</svg>
